<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
  *{margin:0;box-sizing:border-box}
  body{width:1440px;height:900px;overflow:hidden;background:#000;position:relative}
  canvas{position:absolute;left:0;top:0}
  .pull{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#ff7a3d;box-shadow:0 0 0 7px rgba(255,122,61,.28),0 0 26px rgba(255,122,61,.85);z-index:4}
  .dots{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:9px;z-index:5}
  .dots i{width:9px;height:9px;border-radius:9px;background:rgba(255,255,255,.35);transition:none}
  .dots i.on{background:#ff7a3d;width:28px}
  #cur{position:absolute;left:0;top:0;width:32px;height:32px;z-index:10;filter:drop-shadow(0 2px 3px rgba(0,0,0,.55))}
  #ring{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:2px solid rgba(255,255,255,.9);z-index:9;opacity:0}
</style></head>
<body>
<canvas id="bg" width="1440" height="900"></canvas>
<canvas id="fg" width="1440" height="900"></canvas>
<div class="pull" id="pull"></div>
<div class="dots"><i id="d0" class="on"></i><i id="d1"></i></div>
<div id="ring"></div>
<svg id="cur" viewBox="0 0 24 24"><path d="M4 2l15 10.5-6.8 1.2 3.9 7.6-2.9 1.4-3.9-7.7L4 20z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg>
<script>
const R='http://localhost:8765/portfolio/ropa/';
const load=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=R+s;});
let G,A,SP;
window.ready=(async()=>{G=await Promise.all([1,2,3,4].map(n=>load('campera-360/giro-'+n+'.webp')));A=await load('campera-360/apertura.webp');SP=await load('prenda/spin.webp');return true;})();
const W=1440,H=900,CX=720,CY=440, JH=820;
const bg=document.getElementById('bg').getContext('2d'), fg=document.getElementById('fg').getContext('2d');
const off=document.createElement('canvas');off.width=900;off.height=1600;const oc=off.getContext('2d');
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),seg=(t,a,b)=>cl((t-a)/(b-a),0,1),ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,lerp=(a,b,t)=>a+(b-a)*t;
const mix=(c1,c2,t)=>c1.map((v,i)=>Math.round(lerp(v,c2[i],t)));
const rgb=(c,a=1)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
// partículas fijas (semilla)
let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
const PART=Array.from({length:150},()=>({x:rnd()*W,y:rnd()*H,r:.6+rnd()*2.2,s:8+rnd()*26,a:.25+rnd()*.6,front:rnd()<.25,h:rnd()}));
// dibuja un cuadro de la tira en el lienzo auxiliar, con los bordes que se funden (así la prenda "flota")
function frame(img,idx,cols,fw,fh,bgc,zoom){
  oc.globalCompositeOperation='source-over';oc.fillStyle=rgb(bgc);oc.fillRect(0,0,900,1600);
  const s=Math.min(900/fw,1600/fh)*zoom,dw=fw*s,dh=fh*s;
  oc.drawImage(img,(idx%cols)*fw,Math.floor(idx/cols)*fh,fw,fh,(900-dw)/2,(1600-dh)/2,dw,dh);
  oc.globalCompositeOperation='destination-in';
  oc.save();oc.translate(450,800);oc.scale(1,1.7);
  const g=oc.createRadialGradient(0,0,170,0,0,450);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');
  oc.fillStyle=g;oc.fillRect(-450,-500,900,1000);oc.restore();
  return off;
}
const BLACK=[23,26,22], GREY=[214,213,218];
function background(t,k,J){ // J: [{x,y,sc,a,c}] posición y color de fondo de cada prenda visible
  const core=[20,17,34], edge=[6,5,14], line=[123,97,255];
  const g=bg.createRadialGradient(CX,CY,60,CX,CY,900);g.addColorStop(0,rgb(core));g.addColorStop(1,rgb(edge));
  bg.fillStyle=g;bg.fillRect(0,0,W,H);
  const hz=585;bg.save();bg.beginPath();bg.rect(0,hz,W,H-hz);bg.clip();
  for(let i=-18;i<=18;i++){const x=CX+i*120;bg.strokeStyle=rgb(line,.22);bg.lineWidth=1;bg.beginPath();bg.moveTo(CX+i*6,hz);bg.lineTo(x+(x-CX)*1.6,H);bg.stroke();}
  const sp=(t*.35)%1;for(let j=0;j<12;j++){const z=(j+sp)/12,y=hz+Math.pow(z,2.2)*(H-hz);bg.strokeStyle=rgb(line,.05+.22*z);bg.beginPath();bg.moveTo(0,y);bg.lineTo(W,y);bg.stroke();}
  bg.restore();
  // foco de luz de cada prenda, con el mismo color y el mismo degradé que el borde de su cuadro
  for(const j of J){ if(j.a<=0)continue; const w=JH*j.sc*900/1600;
    bg.save();bg.translate(j.x,j.y);bg.scale(1,1.7);
    const gg=bg.createRadialGradient(0,0,w*170/900,0,0,w*450/900);gg.addColorStop(0,rgb(j.c,j.a));gg.addColorStop(1,rgb(j.c,0));
    bg.fillStyle=gg;bg.fillRect(-w,-w,2*w,2*w);bg.restore();}
  bg.save();bg.translate(CX,CY);const rot=t*.25;
  for(let q=0;q<3;q++){const r=400+q*38;bg.beginPath();bg.ellipse(0,0,r*.92,r,0,0,Math.PI*2);
    const gr=bg.createLinearGradient(-r,-r,r,r);gr.addColorStop(0,'rgba(255,157,77,'+(.55-q*.15)+')');gr.addColorStop(.5,'rgba(255,95,162,'+(.45-q*.12)+')');gr.addColorStop(1,'rgba(123,97,255,'+(.5-q*.14)+')');
    bg.strokeStyle=gr;bg.lineWidth=q?1.2:2.5;bg.shadowColor='rgba(255,122,61,.8)';bg.shadowBlur=q?0:22;bg.setLineDash(q==1?[4,14]:q==2?[1,22]:[]);bg.lineDashOffset=-rot*(q?160:0)*(q==2?-1:1);bg.stroke();}
  bg.restore();
  const hg=bg.createRadialGradient(CX,850,10,CX,850,330);hg.addColorStop(0,'rgba(255,122,61,.35)');hg.addColorStop(1,'rgba(255,122,61,0)');
  bg.save();bg.translate(0,850);bg.scale(1,.18);bg.translate(0,-850);bg.fillStyle=hg;bg.fillRect(CX-340,500,680,700);bg.restore();
  parts(bg,t,false,0);
}
function parts(ctx,t,front,k){for(const p of PART){if(p.front!==front)continue;const y=((p.y-t*p.s)%H+H)%H,x=p.x+Math.sin(t*.6+p.h*9)*8;
  const c=p.h<.5?[255,157,77]:(p.h<.8?[255,95,162]:[180,165,255]);ctx.fillStyle=rgb(k>.5&&!front?mix(c,[90,60,245],.4):c,p.a*(front?.8:.55));ctx.beginPath();ctx.arc(x,y,p.r*(front?1.6:1),0,7);ctx.fill();}}
function jacketCanvas(deg,open){ if(open>0.001)return frame(A,Math.round(open*36),6,450,800,BLACK,1);
  const k=((Math.round(deg/2.5)%144)+144)%144;return frame(G[Math.floor(k/36)],k%36,6,450,800,BLACK,1);}
function hoodieCanvas(deg){const k=((Math.round(deg/5)%72)+72)%72;return frame(SP,k,8,480,597,GREY,1.25);}
function put(c,dx,sc,alpha,bob){const h=JH*sc,w=h*900/1600;fg.globalAlpha=alpha;fg.drawImage(c,CX+dx-w/2,CY-h/2+bob,w,h);fg.globalAlpha=1;}
// cursor
const P=(x,y)=>[CX+(x-.5)*460,CY+(y-.5)*JH];
const K=[[0,1150,780,0],[0.8,...P(.18,.56),0],[0.95,...P(.18,.56),1],[3.2,...P(.84,.56),1],[3.35,...P(.84,.56),0],
[4.1,...P(.5,.308),0],[4.3,...P(.5,.308),1],[6.0,...P(.5,.62),1],[6.5,...P(.5,.62),1],[7.6,...P(.5,.308),1],[7.75,...P(.5,.308),0],
[8.5,...P(.95,.5),0],[8.65,...P(.95,.5),1],[9.5,...P(.05,.5),1],[9.65,...P(.05,.5),0],
[10.3,...P(.2,.6),0],[10.45,...P(.2,.6),1],[13.0,...P(.85,.6),1],[13.15,...P(.85,.6),0],
[13.6,...P(.05,.5),0],[13.75,...P(.05,.5),1],[14.5,...P(.95,.5),1],[14.65,...P(.95,.5),0],[15.5,1150,780,0],[16,1150,780,0]];
function cursorAt(t){let i=0;while(i<K.length-2&&t>K[i+1][0])i++;const a=K[i],z=K[i+1],u=ease(seg(t,a[0],z[0]));
  return [lerp(a[1],z[1],u),lerp(a[2],z[2],u),a[3]&&(t<z[0]?true:z[3])];}
window.DURATION=16;
window.render=function(t){
  let deg=0; if(t>=0.95)deg=t<3.2?360*ease(seg(t,.95,3.2)):360+18*Math.sin(seg(t,3.2,3.8)*Math.PI)*(1-seg(t,3.2,3.8));
  let open=0; if(t>=4.3&&t<6.0)open=ease(seg(t,4.3,6.0)); else if(t>=6.0&&t<6.5)open=1; else if(t>=6.5&&t<7.6)open=1-ease(seg(t,6.5,7.6));
  const sw=ease(seg(t,8.65,9.5))-ease(seg(t,13.75,14.5)); // 0 negra · 1 gris
  let d2=0; if(t>=10.45)d2=t<13?360*ease(seg(t,10.45,13)):360+14*Math.sin(seg(t,13,13.6)*Math.PI)*(1-seg(t,13,13.6));
  const bob=Math.sin(t*1.3)*7;
  background(t,sw,[{x:CX-sw*820,y:CY+bob,sc:1-.25*sw,a:1-sw,c:BLACK},{x:CX+(1-sw)*820,y:CY+bob,sc:.75+.25*sw,a:sw,c:GREY}]);
  fg.clearRect(0,0,W,H);
  if(sw<.999)put(jacketCanvas(deg,open),-sw*820,1-.25*sw,1-sw,bob);
  if(sw>.001)put(hoodieCanvas(d2),(1-sw)*820,.75+.25*sw,sw,bob);
  parts(fg,t,true,sw);
  const pull=document.getElementById('pull');const [px,py]=P(.5,.308+(.62-.308)*open);
  pull.style.left=px+'px';pull.style.top=(py+bob)+'px';pull.style.opacity=(t>3.3&&t<8.2)?Math.min(1,seg(t,3.3,3.8)):0;
  document.getElementById('d0').className=sw<.5?'on':'';document.getElementById('d1').className=sw>=.5?'on':'';
  const [x,y,down]=cursorAt(t);
  document.getElementById('cur').style.transform=`translate(${x-4}px,${y-2}px) scale(${down?.88:1})`;
  const ring=document.getElementById('ring');ring.style.left=x+'px';ring.style.top=y+'px';ring.style.opacity=down?.9:0;
};
</script>
</body></html>

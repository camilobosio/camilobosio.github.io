<!doctype html>
<html><head><meta charset="utf-8"><style>*{margin:0}body{width:1080px;height:1080px;overflow:hidden;background:#000}svg{display:block}</style></head>
<body>
<svg id="sv" width="1080" height="1080" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bgv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7b61ff"/><stop offset="1" stop-color="#3a1fd1"/></linearGradient>
  <linearGradient id="pv" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="50"><stop offset="0" stop-color="#ff9d4d"/><stop offset="1" stop-color="#ff5fa2"/></linearGradient>
  <linearGradient id="dr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9d4d"/><stop offset="1" stop-color="#ff5fa2"/></linearGradient>
  <filter id="wet" x="-10%" y="-10%" width="120%" height="130%"><feTurbulence type="fractalNoise" baseFrequency=".35" numOctaves="1" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.2"/></filter>
  <linearGradient id="wood" x1="0" x2="1"><stop offset="0" stop-color="#7a3b12"/><stop offset=".45" stop-color="#c8733a"/><stop offset="1" stop-color="#6b3210"/></linearGradient>
  <linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#8d8f96"/><stop offset=".4" stop-color="#f1f2f5"/><stop offset="1" stop-color="#6e7078"/></linearGradient>
  <linearGradient id="hair" x1="0" x2="1"><stop offset="0" stop-color="#c9a36b"/><stop offset=".5" stop-color="#f0d7a8"/><stop offset="1" stop-color="#b48a52"/></linearGradient>
  <filter id="sh" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation=".9"/></filter>
  <clipPath id="dc"><rect id="dcr" x="0" y="0" width="64" height="0"/></clipPath>
</defs>
<rect width="64" height="64" fill="url(#bgv)"/>
<g filter="url(#wet)">
  <g fill="none" stroke="url(#pv)" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round">
    <path id="p1" d="M27 14 H17 L12 19 V45 L17 50 H46 L51 45 V37 L46 32 H33"/>
    <path id="p2" d="M33 50 V14 H44 L49 19 V27 L44 32 H33"/>
  </g>
  <g id="drips" fill="url(#dr)"></g>
</g>
<!-- pincel: la punta está en (0,0) y mide exactamente el ancho del trazo -->
<g id="brushShadow" opacity=".35" filter="url(#sh)"><use href="#brushShape" fill="#000"/></g>
<g id="brush">
  <g id="brushShape">
    <path id="hairP" d="M-2.1 0 Q-2.35 -3.2 -2.25 -6.2 H2.25 Q2.35 -3.2 2.1 0 Q0 .7 -2.1 0 Z" fill="url(#hair)"/>
    <path id="paintTip" d="M-2.1 0 Q-2.3 -1.6 -2.25 -3.3 H2.25 Q2.3 -1.6 2.1 0 Q0 .7 -2.1 0 Z" fill="#ff7f78"/>
    <rect x="-2.45" y="-10.4" width="4.9" height="4.4" rx=".5" fill="url(#metal)"/>
    <path d="M-2.2 -10.2 L-1.4 -34 Q0 -35.5 1.4 -34 L2.2 -10.2 Z" fill="url(#wood)"/>
  </g>
</g>
</svg>
<script>
const NS='http://www.w3.org/2000/svg';
// chorreado del logo original (mismas formas), en el orden en que los pinta
const D=[
 ['M12.4 50 Q13.6 51.2 13.6 52.5 V57 a1.4 1.4 0 0 0 2.8 0 V52.5 Q16.4 51.2 17.6 50 Z',15,50,58.4,4.2],
 ['M9.7 40 Q10.9 41.2 10.9 42.5 V44 a1.1 1.1 0 0 0 2.2 0 V42.5 Q13.1 41.2 14.3 40 Z',12,40,45.1,3],
 ['M20.2 50 Q21.4 51.2 21.4 52.5 V61 a1.6 1.6 0 0 0 3.2 0 V52.5 Q24.6 51.2 25.8 50 Z',23,50,62.6,4.2],
 ['M26.7 50 Q27.9 51.2 27.9 52.5 V54 a1.1 1.1 0 0 0 2.2 0 V52.5 Q30.1 51.2 31.3 50 Z',29,50,55.1,3.2],
 ['M37.7 32 Q38.9 33.2 38.9 34.5 V37 a1.1 1.1 0 0 0 2.2 0 V34.5 Q41.1 33.2 42.3 32 Z',40,32,38.1,3],
 ['M42.9 14 Q44.1 15.2 44.1 16.5 V17.5 a0.9 0.9 0 0 0 1.8 0 V16.5 Q45.9 15.2 47.1 14 Z',45,14,18.4,2.6],
 ['M37.5 50 Q38.7 51.2 38.7 52.5 V58 a1.3 1.3 0 0 0 2.6 0 V52.5 Q41.3 51.2 42.5 50 Z',40,50,59.3,4],
 ['M44.7 49 Q45.9 50.2 45.9 51.5 V54 a1.1 1.1 0 0 0 2.2 0 V51.5 Q48.1 50.2 49.3 49 Z',47,49,55.1,3.2],
];
const DOTS=[[15,59.5,.9],[24.6,62.5,1.3],[40,61,1]];
const dg=document.getElementById('drips');
const dEls=D.map(d=>{const g=document.createElementNS(NS,'g');const c=document.createElementNS(NS,'clipPath');c.id='c'+Math.random().toString(36).slice(2);
  const r=document.createElementNS(NS,'rect');r.setAttribute('x',0);r.setAttribute('width',64);r.setAttribute('y',0);r.setAttribute('height',0);c.appendChild(r);
  document.querySelector('defs').appendChild(c);const p=document.createElementNS(NS,'path');p.setAttribute('d',d[0]);g.setAttribute('clip-path',`url(#${c.id})`);g.appendChild(p);dg.appendChild(g);return r;});
const dotEls=DOTS.map(([x,y,r])=>{const c=document.createElementNS(NS,'circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',r);c.style.opacity=0;dg.appendChild(c);return c;});
const p1=document.getElementById('p1'),p2=document.getElementById('p2');
const L1=p1.getTotalLength(),L2=p2.getTotalLength();
[p1,p2].forEach((p,i)=>{const L=i?L2:L1;p.style.strokeDasharray=L+' '+L;p.style.strokeDashoffset=L;});
const brush=document.getElementById('brush'),bsh=document.getElementById('brushShadow'),tip=document.getElementById('paintTip'),hairP=document.getElementById('hairP');
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),seg=(t,a,b)=>cl((t-a)/(b-a),0,1),ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,lin=t=>t,lerp=(a,b,t)=>a+(b-a)*t;
function place(x,y,lift,w){ // lift: 0 = apoyado, 1 = levantado; w = ancho de la punta (en unidades del logo)
  const s=w/4.2, up=lift*1.6;
  brush.setAttribute('transform',`translate(${x+up*.35} ${y-up}) rotate(28) scale(${s*(1+lift*.06)})`);
  bsh.setAttribute('transform',`translate(${x+1.2+up*1.4} ${y+1.4+up*.4}) rotate(28) scale(${s})`);
  bsh.setAttribute('opacity',.35-.15*lift);
}
const OUT=[70,-8];
// línea de tiempo (segundos)
const T={in1:[0,.7], s1:[.7,4.3], hop:[4.3,4.75], s2:[4.75,6.6], out:[6.6,7.1], back:[7.35,7.8], drips:[7.8,10.6], dots:[10.6,11.2], out2:[11.3,11.8], end:12.6};
window.DURATION=T.end;
window.render=function(t){
  // trazos
  const a=lin(seg(t,...T.s1)), b=lin(seg(t,...T.s2));
  p1.style.strokeDashoffset=L1*(1-a); p2.style.strokeDashoffset=L2*(1-b);
  // chorreado
  const nd=D.length, span=(T.drips[1]-T.drips[0])/nd;
  let bx=OUT[0],by=OUT[1],lift=1,w=4.2,painting=false;
  D.forEach((d,i)=>{const t0=T.drips[0]+i*span, u=seg(t,t0+span*.3,t0+span);dEls[i].setAttribute('y',d[2]-1);dEls[i].setAttribute('height',(d[3]-d[2]+1)*u+ (u>0?.01:0));});
  DOTS.forEach((d,i)=>{const t0=T.dots[0]+i*(T.dots[1]-T.dots[0])/3;dotEls[i].style.opacity=seg(t,t0+.08,t0+.18);});
  // posición del pincel
  const pt=(p,L,u)=>{const q=p.getPointAtLength(L*u);return [q.x,q.y];};
  if(t<T.in1[1]){const u=ease(seg(t,...T.in1));const [x,y]=pt(p1,L1,0);bx=lerp(OUT[0],x,u);by=lerp(OUT[1],y,u);lift=1-seg(t,T.in1[1]-.2,T.in1[1]);}
  else if(t<T.s1[1]){[bx,by]=pt(p1,L1,a);lift=0;}
  else if(t<T.hop[1]){const u=ease(seg(t,...T.hop));const [x0,y0]=pt(p1,L1,1),[x1,y1]=pt(p2,L2,0);bx=lerp(x0,x1,u);by=lerp(y0,y1,u);lift=Math.sin(u*Math.PI);}
  else if(t<T.s2[1]){[bx,by]=pt(p2,L2,b);lift=0;}
  else if(t<T.back[0]){const u=ease(seg(t,...T.out));const [x,y]=pt(p2,L2,1);bx=lerp(x,OUT[0],u);by=lerp(y,OUT[1],u);lift=seg(t,T.out[0],T.out[0]+.15);}
  else if(t<T.dots[1]+.05){
    // vuelve con el color del chorreado y pinta cada gota de arriba hacia abajo
    let i=Math.min(nd-1,Math.floor((t-T.drips[0])/span));
    if(t<T.drips[0]){const d=D[0];const u=ease(seg(t,...T.back));bx=lerp(OUT[0],d[1],u);by=lerp(OUT[1],d[2],u);lift=1-seg(t,T.back[1]-.15,T.back[1]);w=d[4];}
    else if(t<T.drips[1]){const d=D[i],t0=T.drips[0]+i*span,prev=i?D[i-1]:D[0];
      const mv=seg(t,t0,t0+span*.3), u=seg(t,t0+span*.3,t0+span);
      if(mv<1&&i>0){const e=ease(mv);bx=lerp(prev[1],d[1],e);by=lerp(prev[3]-.5,d[2],e);lift=Math.sin(e*Math.PI);w=lerp(prev[4],d[4],e);}
      else{bx=d[1];by=lerp(d[2],d[3]-.4,u);lift=0;w=lerp(d[4],Math.max(1.9,d[4]*.55),u);}}
    else{const k=Math.min(2,Math.floor((t-T.dots[0])/((T.dots[1]-T.dots[0])/3)));const d=DOTS[k];const t0=T.dots[0]+k*(T.dots[1]-T.dots[0])/3;
      const prev=k?DOTS[k-1]:[D[nd-1][1],D[nd-1][3]];const e=ease(seg(t,t0,t0+.1));bx=lerp(prev[0],d[0],e);by=lerp(prev[1],d[1],e);lift=1-seg(t,t0+.06,t0+.12)+ (seg(t,t0+.2,t0+.2)>0?0:0);w=d[2]*2.2;}
  }
  else{const u=ease(seg(t,...T.out2));const d=DOTS[2];bx=lerp(d[0],OUT[0],u);by=lerp(d[1],OUT[1],u);lift=seg(t,T.out2[0],T.out2[0]+.12);w=2.2;}
  // color de la punta: primero el degradé de las letras, después el del chorreado
  tip.setAttribute('fill', t<T.back[0] ? '#ff8a6a' : '#ff6f8f');
  place(bx,by,lift,w);
};
window.render(0);
</script>
</body></html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelo 3D de producto · Camilo Bosio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@400;600&display=swap">
<style>
  :root{ --bg:#0d0c12; --ink:#f4f4f1; --muted:#a3a2aa; --violet:#5b3cf5; --paint:linear-gradient(90deg,#ff9d4d,#ff5fa2); }
  *{ box-sizing:border-box; margin:0; }
  html,body{ height:100%; }
  body{ background:radial-gradient(120% 90% at 50% 30%, #221d3a 0%, var(--bg) 60%); color:var(--ink); font-family:'Instrument Sans',system-ui,sans-serif; overflow:hidden; }
  #stage{ position:fixed; inset:0; cursor:grab; touch-action:none; }
  #stage:active{ cursor:grabbing; }
  header{ position:fixed; top:20px; left:20px; right:20px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; pointer-events:none; }
  h1{ font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:clamp(22px,3vw,34px); letter-spacing:-.03em; line-height:1; }
  h1 span{ background:var(--paint); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .btn{ pointer-events:auto; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); color:var(--ink); border-radius:999px; padding:10px 16px; font:inherit; font-size:14px; font-weight:600; cursor:pointer; backdrop-filter:blur(8px); }
  .btn:hover{ background:rgba(255,255,255,.14); }
  .hint{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); font-size:13.5px; color:var(--muted); background:rgba(0,0,0,.35); padding:8px 14px; border-radius:999px; white-space:nowrap; transition:opacity .6s; pointer-events:none; }
  .drop{ position:fixed; inset:14px; border:2px dashed rgba(255,157,77,.8); border-radius:22px; display:grid; place-items:center; font-size:18px; font-weight:600; background:rgba(13,12,18,.6); opacity:0; pointer-events:none; transition:opacity .2s; }
  body.dragging .drop{ opacity:1; }
  .msg{ position:fixed; top:74px; left:20px; right:20px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<canvas id="stage" aria-label="Producto en 3D: arrastrá para girarlo, rueda o pellizco para acercar"></canvas>
<header>
  <h1>Producto <span>en 3D</span></h1>
  <label class="btn">Cargar modelo (.glb)<input type="file" id="file" accept=".glb,.gltf" hidden></label>
</header>
<p class="msg" id="msg"></p>
<div class="hint" id="hint">Arrastrá para girar · Rueda o pellizco para acercar</div>
<div class="drop">Soltá el archivo .glb acá</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ====== AJUSTES (lo que más se toca) ====== */
const MODELO = 'modelo.glb';   // archivo 3D del producto, en esta misma carpeta
const TAMANIO = 1.6;           // qué tan grande se ve (alto del producto en pantalla)
const GIRA_SOLO = false;       // pedido de Camilo: NUNCA gira sola, solo con el mouse/dedo
/* ========================================== */

const canvas = document.getElementById('stage'), msg = document.getElementById('msg');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
camera.position.set(0, 0.35, 4.2);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;   // suavizado + inercia corta
controls.enablePan = false;
controls.minDistance = 2.2; controls.maxDistance = 7;
controls.minPolarAngle = Math.PI * 0.2; controls.maxPolarAngle = Math.PI * 0.62;
controls.autoRotate = GIRA_SOLO;

// luz principal + relleno
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(1.2, 6, 2); key.castShadow = true; key.shadow.mapSize.set(1024, 1024); scene.add(key);
scene.add(new THREE.HemisphereLight(0xe7e2fe, 0x221d3a, 0.6));
const rim = new THREE.DirectionalLight(0xff7a3d, 1.2); rim.position.set(-3, 2, -3); scene.add(rim);

// sombra suave en el "piso" (invisible)
const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.ShadowMaterial({ opacity: 0.35 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -TAMANIO / 2; floor.receiveShadow = true; scene.add(floor);

let producto = null;
function mostrar(obj) {
  if (producto) scene.remove(producto);
  // centrar y escalar cualquier modelo al mismo tamaño
  const box = new THREE.Box3().setFromObject(obj), size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  const k = TAMANIO / Math.max(size.y, size.x * 0.8, size.z * 0.8);
  obj.position.sub(center.multiplyScalar(k)); obj.scale.multiplyScalar(k);
  const pivot = new THREE.Group(); pivot.add(obj);
  obj.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(pivot); producto = pivot;
  controls.target.set(0, 0, 0); controls.update();
}

// Producto de muestra (un frasco de perfume armado con formas) hasta que haya un modelo real
function muestra() {
  const g = new THREE.Group();
  const vidrio = new THREE.MeshPhysicalMaterial({ color: 0xffc2d6, roughness: 0.05, transmission: 0.9, thickness: 0.6, ior: 1.45, clearcoat: 1 });
  const liquido = new THREE.MeshPhysicalMaterial({ color: 0xff7a9c, roughness: 0.2, transmission: 0.5, thickness: 0.4 });
  const oro = new THREE.MeshStandardMaterial({ color: 0xd4a857, metalness: 1, roughness: 0.25 });
  const cuerpo = new THREE.Mesh(new THREE.BoxGeometry(1, 1.1, 0.55, 4, 4, 4), vidrio); g.add(cuerpo);
  const jugo = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.8, 0.42), liquido); jugo.position.y = -0.1; g.add(jugo);
  const cuello = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 0.14, 32), oro); cuello.position.y = 0.62; g.add(cuello);
  const tapa = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.42, 48), oro); tapa.position.y = 0.9; g.add(tapa);
  const etiqueta = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.18), new THREE.MeshStandardMaterial({ color: 0x111113, roughness: 0.6 })); etiqueta.position.set(0, 0, 0.28); g.add(etiqueta);
  return g;
}

const loader = new GLTFLoader();
function cargar(url, nombre) {
  msg.textContent = 'Cargando ' + nombre + '…';
  loader.load(url, gltf => { mostrar(gltf.scene); msg.textContent = nombre; }, undefined, () => { msg.textContent = 'No se pudo abrir ' + nombre; });
}
// intenta abrir modelo.glb; si no está, muestra el frasco de muestra
loader.load(MODELO, gltf => { mostrar(gltf.scene); msg.textContent = ''; }, undefined, () => { mostrar(muestra()); msg.textContent = 'Modelo de muestra · cargá tu .glb con el botón o soltándolo acá'; });

// cargar desde el botón o arrastrando el archivo
const abrir = f => { if (f) { const u = URL.createObjectURL(f); cargar(u, f.name); } };
document.getElementById('file').addEventListener('change', e => abrir(e.target.files[0]));
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('dragging'); abrir(e.dataTransfer.files[0]); });

// la ayuda se va al primer arrastre
controls.addEventListener('start', () => { document.getElementById('hint').style.opacity = 0; }, { once: true });

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < 600 ? 45 : 35; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
